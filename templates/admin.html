<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #3b82f6;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.45);
        }

        body {
            background: #09090b;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            position: relative;
        }

        /* 로그인 화면 스타일 */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .login-box h2 {
            margin-bottom: 24px;
            font-size: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-box input:focus {
            border-color: var(--primary);
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-box button:hover {
            opacity: 0.9;
        }

        /* 메인 콘텐츠 래퍼 (초기엔 숨김) */
        #app-content {
            display: none;
            padding: 32px;
        }

        /* 기존 스타일들 유지 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59, 130, 246, 0.08), transparent),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(99, 102, 241, 0.06), transparent);
            pointer-events: none;
        }

        .admin-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            animation: fadeDown 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
        }

        .admin-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-icon svg { width: 24px; height: 24px; color: white; }
        h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 540px) { #content { grid-template-columns: 1fr; } }

        .item {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.25s ease;
            animation: cardEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
        }

        .item:hover {
            border-color: var(--border-hover);
            background: var(--surface-hover);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .folder-name { font-size: 14px; font-weight: 600; color: var(--primary); font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace; }
        .time-stamp { font-size: 12px; color: var(--text-muted); }
        
        .item-badge {
            padding: 4px 10px;
            background: var(--primary-soft);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
        }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .img-box { position: relative; border-radius: 10px; overflow: hidden; background: rgba(0, 0, 0, 0.4); }
        .img-title {
            position: absolute; top: 8px; left: 8px; padding: 4px 8px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border-radius: 6px; font-size: 11px; font-weight: 500; color: var(--text-muted); z-index: 2;
        }
        .img-box img { width: 100%; height: auto; display: block; transition: transform 0.3s ease; }
        .img-box:hover img { transform: scale(1.02); }

        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 80px 40px;
            background: var(--surface); border: 1px dashed var(--border);
            border-radius: 16px; animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } }
        .empty-icon { width: 48px; height: 48px; margin: 0 auto 16px; color: var(--text-muted); opacity: 0.5; }
        .empty-text { font-size: 14px; color: var(--text-muted); }

        :root {
            --primary: #ff6b45;
            --primary-soft: rgba(255, 107, 69, 0.14);
            --surface: rgba(255, 255, 255, 0.045);
            --surface-hover: rgba(255, 255, 255, 0.072);
            --border: rgba(255, 255, 255, 0.085);
            --border-hover: rgba(255, 255, 255, 0.17);
            --text: #fffaf4;
            --text-muted: rgba(255, 250, 244, 0.52);
        }

        body {
            background: #121017;
            font-family: Inter, Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body::before {
            opacity: 1;
            background:
                linear-gradient(rgba(255, 255, 255, 0.024) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px),
                radial-gradient(circle at 12% 4%, rgba(255, 107, 69, 0.14), transparent 28%),
                radial-gradient(circle at 92% 94%, rgba(83, 224, 192, 0.09), transparent 30%);
            background-size: 44px 44px, 44px 44px, auto, auto;
        }

        #login-overlay {
            padding: 22px;
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 107, 69, 0.14), transparent 30%),
                #121017;
        }

        #login-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.55;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 42px 42px;
        }

        .login-box {
            position: relative;
            z-index: 1;
            max-width: 390px;
            padding: 38px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            background: rgba(31, 27, 37, 0.88);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .login-box::before {
            content: "";
            display: block;
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            border: 7px solid rgba(255, 255, 255, 0.92);
            border-radius: 17px;
            background: var(--primary);
            box-shadow:
                inset 0 0 0 8px var(--primary),
                inset 0 0 0 11px rgba(255, 255, 255, 0.92),
                0 12px 26px rgba(255, 107, 69, 0.26);
            transform: rotate(-4deg);
        }

        .login-box h2 {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 850;
            letter-spacing: -0.04em;
        }

        .login-box input {
            min-height: 52px;
            margin-bottom: 14px;
            padding: 13px 16px;
            border-color: rgba(255, 255, 255, 0.11);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.22);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .login-box input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.30);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .login-box button {
            min-height: 52px;
            border-radius: 14px;
            background: var(--primary);
            box-shadow: 0 12px 26px rgba(255, 107, 69, 0.22);
            font-family: inherit;
            font-weight: 800;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .login-box button:hover {
            background: #f25531;
            box-shadow: 0 16px 30px rgba(255, 107, 69, 0.28);
            opacity: 1;
            transform: translateY(-2px);
        }

        .login-box button:focus-visible,
        .login-box input:focus-visible {
            outline: 3px solid rgba(255, 205, 77, 0.78);
            outline-offset: 3px;
        }

        #app-content {
            max-width: 1640px;
            margin: 0 auto;
            padding: clamp(22px, 3vw, 46px);
        }

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 20;
            gap: 14px;
            margin-bottom: 28px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(18, 16, 23, 0.82);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.20);
            backdrop-filter: blur(22px) saturate(130%);
            -webkit-backdrop-filter: blur(22px) saturate(130%);
        }

        .admin-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary);
            box-shadow: 0 10px 24px rgba(255, 107, 69, 0.23);
            transform: rotate(-3deg);
        }

        .admin-icon svg {
            width: 22px;
            height: 22px;
        }

        h1 {
            font-size: clamp(20px, 2.4vw, 26px);
            font-weight: 850;
            letter-spacing: -0.045em;
        }

        .live-indicator {
            border-color: rgba(92, 230, 196, 0.16);
            background: rgba(92, 230, 196, 0.08);
            color: rgba(149, 244, 220, 0.82);
            font-weight: 650;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #5ce6c4;
            box-shadow: 0 0 0 4px rgba(92, 230, 196, 0.11);
        }

        #content {
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr));
            gap: 22px;
        }

        .item {
            padding: 16px;
            border-color: var(--border);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .item:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.065);
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.24);
            transform: translateY(-3px);
        }

        .item-header {
            align-items: center;
            margin-bottom: 14px;
            padding: 2px 2px 14px;
        }

        .folder-name {
            max-width: 34ch;
            overflow: hidden;
            color: #ff9b7e;
            font-size: 12px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .time-stamp {
            font-size: 11px;
        }

        .item-badge {
            border: 1px solid rgba(255, 107, 69, 0.20);
            background: var(--primary-soft);
            color: #ff9b7e;
            letter-spacing: 0.02em;
        }

        .row {
            gap: 10px;
        }

        .img-box {
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 15px;
            background: #0d0b10;
        }

        .img-box img {
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .img-title {
            top: 10px;
            left: 10px;
            padding: 5px 9px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            background: rgba(10, 8, 12, 0.72);
            color: rgba(255, 250, 244, 0.72);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .empty-state {
            padding: 96px 40px;
            border-color: rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.025);
        }

        @media (max-width: 680px) {
            #app-content {
                padding: 14px;
            }

            .admin-header {
                top: 8px;
                padding: 12px;
            }

            .live-indicator {
                padding: 7px 10px;
            }

            .live-indicator span:last-child {
                display: none;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 30px 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>관리자 인증</h2>
            <input type="password" id="pwd-input" placeholder="비밀번호를 입력하세요">
            <button id="login-btn">접속하기</button>
        </div>
    </div>

    <div id="app-content">
        <header class="admin-header">
            <div class="admin-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
            </div>
            <h1>관리자 페이지</h1>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>실시간 업데이트</span>
            </div>
        </header>

        <div id="content"></div>
    </div>

    <script>
        const TARGET_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function attemptLogin() {
            const input = document.getElementById('pwd-input').value;
            const hashedInput = await hashPassword(input);

            if (hashedInput === TARGET_HASH) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                
                loadData();
                setInterval(loadData, 3000);
            } else {
                alert('비밀번호가 일치하지 않습니다.');
                document.getElementById('pwd-input').value = '';
            }
        }

        document.getElementById('login-btn').addEventListener('click', attemptLogin);
        document.getElementById('pwd-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') attemptLogin();
        });

        let oldItems = [];

        function createItemHTML(item) {
            return `
                <div class="item" id="item-${item.folder}">
                    <div class="item-header">
                        <div class="item-info">
                            <div class="folder-name">${item.folder}</div>
                            <div class="time-stamp">${item.time}</div>
                        </div>
                        <div class="item-badge">처리됨</div>
                    </div>

                    <div class="row">
                        <div class="img-box">
                            <div class="img-title">RAW</div>
                            <img src="/public/${item.folder}/raw.png?cache=${item.timestamp}" alt="RAW">
                        </div>
                        <div class="img-box">
                            <div class="img-title">Result</div>
                            <img src="/public/${item.folder}/result.png?cache=${item.timestamp}" alt="Result">
                        </div>
                    </div>
                </div>
            `;
        }

        function updateDOM(newItems) {
            const container = document.getElementById("content");

            if (newItems.length === 0 && oldItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <div class="empty-text">아직 처리된 이미지가 없습니다</div>
                    </div>
                `;
                return;
            }

            const emptyState = container.querySelector('.empty-state');
            if (emptyState && newItems.length > 0) {
                emptyState.remove();
            }

            newItems.forEach((item, index) => {
                const id = `item-${item.folder}`;
                let el = document.getElementById(id);

                if (!el) {
                    const div = document.createElement("div");
                    div.innerHTML = createItemHTML(item);
                    const newEl = div.firstElementChild;
                    newEl.style.animationDelay = `${index * 0.08}s`;
                    container.prepend(newEl);
                }
            });

            oldItems.forEach(item => {
                if (!newItems.find(n => n.folder === item.folder)) {
                    const el = document.getElementById(`item-${item.folder}`);
                    if (el) {
                        el.style.animation = 'cardExit 0.25s ease forwards';
                        setTimeout(() => el.remove(), 250);
                    }
                }
            });

            oldItems = newItems;
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes cardExit {
                to {
                    opacity: 0;
                    transform: translateY(-12px) scale(0.98);
                }
            }
        `;
        document.head.appendChild(style);

        async function loadData() {
            try {
                const res = await fetch("/admin_data");
                if (res.ok) {
                    const items = await res.json();
                    updateDOM(items);
                }
            } catch (e) {
                console.error("데이터를 불러오는데 실패했습니다.", e);
            }
        }
    </script>
</body>
</html>
