<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #3b82f6;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.45);
        }

        body {
            background: #09090b;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            position: relative;
        }

        /* 로그인 화면 스타일 */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .login-box h2 {
            margin-bottom: 24px;
            font-size: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-box input:focus {
            border-color: var(--primary);
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-box button:hover {
            opacity: 0.9;
        }

        /* 메인 콘텐츠 래퍼 (초기엔 숨김) */
        #app-content {
            display: none;
            padding: 32px;
        }

        /* 기존 스타일들 유지 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59, 130, 246, 0.08), transparent),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(99, 102, 241, 0.06), transparent);
            pointer-events: none;
        }

        .admin-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            animation: fadeDown 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
        }

        .admin-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-icon svg { width: 24px; height: 24px; color: white; }
        h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 540px) { #content { grid-template-columns: 1fr; } }

        .item {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.25s ease;
            animation: cardEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
        }

        .item:hover {
            border-color: var(--border-hover);
            background: var(--surface-hover);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .folder-name { font-size: 14px; font-weight: 600; color: var(--primary); font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace; }
        .time-stamp { font-size: 12px; color: var(--text-muted); }
        
        .item-badge {
            padding: 4px 10px;
            background: var(--primary-soft);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
        }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .img-box { position: relative; border-radius: 10px; overflow: hidden; background: rgba(0, 0, 0, 0.4); }
        .img-title {
            position: absolute; top: 8px; left: 8px; padding: 4px 8px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border-radius: 6px; font-size: 11px; font-weight: 500; color: var(--text-muted); z-index: 2;
        }
        .img-box img { width: 100%; height: auto; display: block; transition: transform 0.3s ease; }
        .img-box:hover img { transform: scale(1.02); }

        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 80px 40px;
            background: var(--surface); border: 1px dashed var(--border);
            border-radius: 16px; animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } }
        .empty-icon { width: 48px; height: 48px; margin: 0 auto 16px; color: var(--text-muted); opacity: 0.5; }
        .empty-text { font-size: 14px; color: var(--text-muted); }

        :root {
            --primary: #ff6b45;
            --primary-soft: rgba(255, 107, 69, 0.14);
            --surface: rgba(255, 255, 255, 0.045);
            --surface-hover: rgba(255, 255, 255, 0.072);
            --border: rgba(255, 255, 255, 0.085);
            --border-hover: rgba(255, 255, 255, 0.17);
            --text: #fffaf4;
            --text-muted: rgba(255, 250, 244, 0.52);
        }

        body {
            background: #121017;
            font-family: Inter, Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body::before {
            opacity: 1;
            background:
                linear-gradient(rgba(255, 255, 255, 0.024) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px),
                radial-gradient(circle at 12% 4%, rgba(255, 107, 69, 0.14), transparent 28%),
                radial-gradient(circle at 92% 94%, rgba(83, 224, 192, 0.09), transparent 30%);
            background-size: 44px 44px, 44px 44px, auto, auto;
        }

        #login-overlay {
            padding: 22px;
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 107, 69, 0.14), transparent 30%),
                #121017;
        }

        #login-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.55;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 42px 42px;
        }

        .login-box {
            position: relative;
            z-index: 1;
            max-width: 390px;
            padding: 38px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            background: rgba(31, 27, 37, 0.88);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .login-box::before {
            content: "";
            display: block;
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            border: 7px solid rgba(255, 255, 255, 0.92);
            border-radius: 17px;
            background: var(--primary);
            box-shadow:
                inset 0 0 0 8px var(--primary),
                inset 0 0 0 11px rgba(255, 255, 255, 0.92),
                0 12px 26px rgba(255, 107, 69, 0.26);
            transform: rotate(-4deg);
        }

        .login-box h2 {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 850;
            letter-spacing: -0.04em;
        }

        .login-box input {
            min-height: 52px;
            margin-bottom: 14px;
            padding: 13px 16px;
            border-color: rgba(255, 255, 255, 0.11);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.22);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .login-box input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.30);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .login-box button {
            min-height: 52px;
            border-radius: 14px;
            background: var(--primary);
            box-shadow: 0 12px 26px rgba(255, 107, 69, 0.22);
            font-family: inherit;
            font-weight: 800;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .login-box button:hover {
            background: #f25531;
            box-shadow: 0 16px 30px rgba(255, 107, 69, 0.28);
            opacity: 1;
            transform: translateY(-2px);
        }

        .login-box button:focus-visible,
        .login-box input:focus-visible {
            outline: 3px solid rgba(255, 205, 77, 0.78);
            outline-offset: 3px;
        }

        #app-content {
            max-width: 1640px;
            margin: 0 auto;
            padding: clamp(22px, 3vw, 46px);
        }

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 20;
            gap: 14px;
            margin-bottom: 28px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(18, 16, 23, 0.82);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.20);
            backdrop-filter: blur(22px) saturate(130%);
            -webkit-backdrop-filter: blur(22px) saturate(130%);
        }

        .admin-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary);
            box-shadow: 0 10px 24px rgba(255, 107, 69, 0.23);
            transform: rotate(-3deg);
        }

        .admin-icon svg {
            width: 22px;
            height: 22px;
        }

        h1 {
            font-size: clamp(20px, 2.4vw, 26px);
            font-weight: 850;
            letter-spacing: -0.045em;
        }

        .live-indicator {
            margin-left: 0;
            font-weight: 650;
            transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .live-indicator.is-online {
            border-color: rgba(92, 230, 196, 0.20);
            background: rgba(92, 230, 196, 0.09);
            color: #79f0d3;
        }

        .live-indicator.is-offline {
            border-color: rgba(255, 107, 114, 0.24);
            background: rgba(255, 107, 114, 0.09);
            color: #ff6b72;
        }

        .admin-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            margin-left: auto;
        }

        .admin-stats {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .admin-stat {
            display: flex;
            min-width: 88px;
            min-height: 44px;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            padding: 7px 10px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.045);
        }

        .admin-stat-transform {
            min-width: 160px;
        }

        .admin-stat-label {
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .admin-stat-value {
            color: rgb(240, 242, 232);
            font-size: 13px;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
        }

        .stats-success {
            color: #5ce6c4;
        }

        .stats-failure {
            color: #ff6b72;
        }

        .stats-neutral {
            color: rgb(240, 242, 232);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: currentColor;
            box-shadow: none;
            animation: none;
        }

        .live-indicator.is-online .live-dot {
            box-shadow: 0 0 0 4px rgba(92, 230, 196, 0.11);
            animation: pulse 2s ease-in-out infinite;
        }

        .live-indicator.is-offline .live-dot {
            box-shadow: 0 0 0 4px rgba(255, 107, 114, 0.11);
        }

        #content {
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr));
            gap: 22px;
        }

        .item {
            padding: 16px;
            border-color: var(--border);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .item:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.065);
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.24);
            transform: translateY(-3px);
        }

        .item-header {
            align-items: center;
            margin-bottom: 14px;
            padding: 2px 2px 14px;
        }

        .folder-name {
            max-width: 34ch;
            overflow: hidden;
            color: #ff9b7e;
            font-size: 12px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .time-stamp {
            font-size: 11px;
        }

        .item-badge {
            border: 1px solid rgba(255, 107, 69, 0.20);
            background: var(--primary-soft);
            color: #ff9b7e;
            letter-spacing: 0.02em;
        }

        .item-badge.status-success {
            border-color: rgba(92, 230, 196, 0.24);
            background: rgba(92, 230, 196, 0.10);
            color: #79f0d3;
        }

        .item-badge.status-failed {
            border-color: rgba(255, 107, 114, 0.26);
            background: rgba(255, 107, 114, 0.10);
            color: #ff858b;
        }

        .item-badge.status-processing {
            border-color: rgba(255, 190, 92, 0.24);
            background: rgba(255, 190, 92, 0.10);
            color: #ffc978;
        }

        .item-badge.status-captured {
            border-color: rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.055);
            color: var(--text-muted);
        }

        .photo-metadata {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
            margin: 0 0 14px;
        }

        .photo-metadata-item {
            min-width: 0;
            padding: 9px 10px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.035);
        }

        .photo-metadata-label,
        .photo-metadata-value {
            min-width: 0;
            margin: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .photo-metadata-label {
            margin-bottom: 4px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
        }

        .photo-metadata-value {
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            line-height: 1.35;
        }

        .row {
            gap: 10px;
        }

        .img-box {
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 15px;
            background: #0d0b10;
        }

        .img-box img {
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }

        .image-placeholder {
            display: grid;
            aspect-ratio: 4 / 3;
            place-items: center;
            padding: 18px;
            text-align: center;
        }

        .image-placeholder-copy {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 650;
            line-height: 1.5;
        }

        .image-open-button {
            display: block;
            width: 100%;
            padding: 0;
            color: inherit;
            font: inherit;
            text-align: left;
            appearance: none;
            cursor: zoom-in;
        }

        .image-open-button:focus-visible {
            outline: 3px solid rgba(255, 107, 69, 0.72);
            outline-offset: 3px;
        }

        body.image-modal-open {
            overflow: hidden;
        }

        .image-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(5, 4, 7, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition:
                opacity 0.22s ease,
                visibility 0s linear 0.22s;
        }

        .image-modal.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition-delay: 0s;
        }

        .image-modal-dialog {
            display: flex;
            flex-direction: column;
            width: min(96vw, 1600px);
            height: min(94vh, 1200px);
            min-height: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 22px;
            background: #0d0b10;
            box-shadow: 0 36px 100px rgba(0, 0, 0, 0.56);
            transform: translateY(18px) scale(0.98);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .image-modal.is-visible .image-modal-dialog {
            transform: translateY(0) scale(1);
        }

        .image-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        }

        .image-modal-title {
            overflow: hidden;
            font-size: 14px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .image-modal-close {
            flex: none;
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #fffaf4;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }

        .image-modal-close:hover {
            background: rgba(255, 255, 255, 0.13);
        }

        .image-modal-stage {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 16px;
            overflow: hidden;
        }

        .image-modal-stage img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .img-title {
            top: 10px;
            left: 10px;
            padding: 5px 9px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            background: rgba(10, 8, 12, 0.72);
            color: rgba(255, 250, 244, 0.72);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .empty-state {
            padding: 96px 40px;
            border-color: rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.025);
        }

        .coin-client-panel {
            position: relative;
            z-index: 1;
            margin-bottom: 28px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            background: #111114;
        }

        .coin-client-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        .coin-client-eyebrow {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .coin-client-title {
            font-size: 17px;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        .coin-client-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .coin-client-summary strong {
            color: var(--text);
            font-size: 13px;
        }

        .coin-client-summary-divider {
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.16);
        }

        .coin-client-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
        }

        .coin-client-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: #18181c;
        }

        .coin-client-identity {
            min-width: 0;
        }

        .coin-client-name {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 650;
        }

        .coin-client-id {
            display: block;
            overflow: hidden;
            color: var(--text-muted);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .coin-client-balance {
            flex: none;
            min-width: 56px;
            color: #f8fafc;
            font-size: 18px;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .coin-client-balance-unit {
            margin-left: 2px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
        }

        .coin-client-empty {
            grid-column: 1 / -1;
            padding: 22px 16px;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 680px) {
            #app-content {
                padding: 14px;
            }

            .admin-header {
                top: 8px;
                flex-wrap: wrap;
                padding: 12px;
            }

            .admin-header-actions {
                width: 100%;
                align-items: stretch;
                flex-direction: column;
                margin-left: 0;
            }

            .admin-stats {
                display: grid;
                grid-template-columns: minmax(0, 0.75fr) minmax(0, 1.55fr) minmax(0, 0.75fr);
                width: 100%;
                gap: 6px;
                overflow: visible;
            }

            .admin-stat {
                min-width: 0;
                padding: 7px 8px;
            }

            .admin-stat-transform {
                min-width: 0;
            }

            .live-indicator {
                align-self: flex-end;
                padding: 7px 10px;
            }

            .live-indicator span:last-child {
                display: inline;
                font-size: 10px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 30px 22px;
            }

            .image-modal {
                padding: 10px;
            }

            .image-modal-dialog {
                width: 100%;
                height: 96vh;
                border-radius: 16px;
            }

            .image-modal-stage {
                padding: 8px;
            }

            .coin-client-panel {
                margin-bottom: 18px;
                padding: 15px;
            }

            .coin-client-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .coin-client-list {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>관리자 인증</h2>
            <input type="password" id="pwd-input" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
            <button id="login-btn" type="button">접속하기</button>
        </div>
    </div>

    <div id="app-content">
        <header class="admin-header">
            <div class="admin-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
            </div>
            <h1>관리자 페이지</h1>
            <div class="admin-header-actions">
                <div class="admin-stats" aria-label="촬영 및 변환 통계">
                    <div class="admin-stat">
                        <span class="admin-stat-label">촬영 수</span>
                        <strong id="photo-count" class="admin-stat-value">0</strong>
                    </div>
                    <div class="admin-stat admin-stat-transform">
                        <span class="admin-stat-label">변환 성공 / 실패 / 미변환</span>
                        <strong id="transform-summary" class="admin-stat-value" aria-label="변환 성공 0, 실패 0, 미변환 0, 전체 0">
                            <span id="transform-success-count" class="stats-success">0</span><span class="stats-neutral">/</span><span id="transform-failure-count" class="stats-failure">0</span><span class="stats-neutral">/</span><span id="transform-untransformed-count" class="stats-neutral">0</span><span class="stats-neutral">(total:</span><span id="transform-total-count" class="stats-neutral">0</span><span class="stats-neutral">)</span>
                        </strong>
                    </div>
                    <div class="admin-stat">
                        <span class="admin-stat-label">변환 성공률</span>
                        <strong id="transform-success-rate" class="admin-stat-value">0%</strong>
                    </div>
                </div>
                <div id="live-update-indicator" class="live-indicator is-offline" aria-live="polite" aria-label="실시간 업데이트: 연결 확인 중">
                    <span class="live-dot"></span>
                    <span>실시간 업데이트</span>
                </div>
            </div>
        </header>

        <section class="coin-client-panel" aria-labelledby="coin-client-title">
            <div class="coin-client-header">
                <div>
                    <span class="coin-client-eyebrow">COIN BALANCE</span>
                    <h2 id="coin-client-title" class="coin-client-title">기기별 코인 현황</h2>
                </div>
                <div class="coin-client-summary" aria-live="polite">
                    <strong id="coin-client-count">0대</strong>
                    <span class="coin-client-summary-divider" aria-hidden="true"></span>
                    <span>전체 <strong id="coin-balance-total">0개</strong></span>
                </div>
            </div>
            <div id="coin-client-list" class="coin-client-list">
                <p class="coin-client-empty">현재 서버에 연결된 기기가 없습니다.</p>
            </div>
        </section>

        <div id="content"></div>
    </div>

    <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="image-modal-title">
        <div class="image-modal-dialog">
            <div class="image-modal-header">
                <strong id="image-modal-title" class="image-modal-title">이미지 전체 보기</strong>
                <button id="image-modal-close" class="image-modal-close" type="button" aria-label="이미지 전체 보기 닫기">&times;</button>
            </div>
            <div class="image-modal-stage">
                <img id="image-modal-preview" src="" alt="">
            </div>
        </div>
    </div>

    <script>
        let adminRefreshTimer = null;
        let liveUpdateHealthTimer = null;
        let adminDataRequestInFlight = false;
        const ADMIN_REFRESH_TIMEOUT_MS = 10000;
        const LIVE_UPDATE_STALE_AFTER_MS = 10000;
        let lastSuccessfulAdminRefreshAt = 0;

        function setLiveUpdateStatus(isOnline) {
            const indicator = document.getElementById('live-update-indicator');
            if (!indicator) return;

            if (isOnline) lastSuccessfulAdminRefreshAt = Date.now();
            indicator.classList.toggle('is-online', isOnline);
            indicator.classList.toggle('is-offline', !isOnline);
            const statusText = isOnline ? '정상 작동 중' : '연결 오류';
            indicator.setAttribute('aria-label', `실시간 업데이트: ${statusText}`);
            indicator.title = statusText;
        }

        function checkLiveUpdateHealth() {
            if (
                lastSuccessfulAdminRefreshAt > 0
                && Date.now() - lastSuccessfulAdminRefreshAt > LIVE_UPDATE_STALE_AFTER_MS
            ) {
                setLiveUpdateStatus(false);
            }
        }

        function updateStats(stats = {}) {
            const photoCount = Number(stats.photo_count) || 0;
            const successCount = Number(stats.success_count) || 0;
            const failureCount = Number(stats.failure_count) || 0;
            const untransformedCount = Number(stats.untransformed_count) || 0;
            const summaryTotalValue = Number(stats.summary_total);
            const summaryTotal = Number.isFinite(summaryTotalValue)
                ? summaryTotalValue
                : successCount + failureCount + untransformedCount;
            const successRate = Number(stats.success_rate) || 0;
            const formattedRate = Number.isInteger(successRate)
                ? `${successRate}%`
                : `${successRate.toFixed(1)}%`;

            document.getElementById('photo-count').textContent = photoCount;
            document.getElementById('transform-success-count').textContent = successCount;
            document.getElementById('transform-failure-count').textContent = failureCount;
            document.getElementById('transform-untransformed-count').textContent = untransformedCount;
            document.getElementById('transform-total-count').textContent = summaryTotal;
            document.getElementById('transform-success-rate').textContent = formattedRate;
            document.getElementById('transform-summary').setAttribute(
                'aria-label',
                `변환 성공 ${successCount}, 실패 ${failureCount}, 미변환 ${untransformedCount}, 전체 ${summaryTotal}`
            );
        }

        function updateCoinClients(coinClients = []) {
            const clients = Array.isArray(coinClients)
                ? coinClients
                    .filter(client => typeof client?.client_id === 'string')
                    .map(client => ({
                        clientId: client.client_id,
                        balance: Math.max(0, Number(client.balance) || 0)
                    }))
                : [];
            const totalBalance = clients.reduce((sum, client) => sum + client.balance, 0);
            const list = document.getElementById('coin-client-list');

            document.getElementById('coin-client-count').textContent = `${clients.length}대`;
            document.getElementById('coin-balance-total').textContent = `${totalBalance.toLocaleString('ko-KR')}개`;
            list.replaceChildren();

            if (clients.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'coin-client-empty';
                empty.textContent = '현재 서버에 연결된 기기가 없습니다.';
                list.appendChild(empty);
                return;
            }

            clients.forEach((client, index) => {
                const card = document.createElement('article');
                card.className = 'coin-client-card';

                const identity = document.createElement('div');
                identity.className = 'coin-client-identity';

                const name = document.createElement('strong');
                name.className = 'coin-client-name';
                name.textContent = `기기 ${index + 1}`;

                const clientId = document.createElement('code');
                clientId.className = 'coin-client-id';
                clientId.textContent = client.clientId;
                clientId.title = client.clientId;

                const balance = document.createElement('strong');
                balance.className = 'coin-client-balance';
                balance.textContent = client.balance.toLocaleString('ko-KR');

                const unit = document.createElement('span');
                unit.className = 'coin-client-balance-unit';
                unit.textContent = '개';
                balance.appendChild(unit);

                identity.append(name, clientId);
                card.append(identity, balance);
                list.appendChild(card);
            });
        }

        function renderAdminData(data) {
            if (Array.isArray(data)) {
                updateStats();
                updateCoinClients();
                updateDOM(data.map(item => ({
                    ...item,
                    id: item.id || item.folder,
                    status: item.status || 'success',
                    raw_url: item.raw_url || `/public/${item.folder}/raw.png`,
                    result_url: item.result_url || `/public/${item.folder}/result.png`
                })));
                return;
            }
            updateStats(data?.stats);
            updateCoinClients(data?.coin_clients);
            updateDOM(Array.isArray(data?.items) ? data.items : []);
        }

        function showAdmin(initialData = null) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            if (initialData) {
                renderAdminData(initialData);
                setLiveUpdateStatus(true);
            } else {
                setLiveUpdateStatus(false);
                loadData();
            }
            if (!adminRefreshTimer) adminRefreshTimer = setInterval(loadData, 3000);
            if (!liveUpdateHealthTimer) {
                liveUpdateHealthTimer = setInterval(checkLiveUpdateHealth, 1000);
            }
        }

        async function attemptLogin() {
            const input = document.getElementById('pwd-input').value;
            const button = document.getElementById('login-btn');
            if (!input) return;

            button.disabled = true;
            try {
                const res = await fetch('/admin_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: input })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || '관리자 로그인에 실패했습니다.');
                document.getElementById('pwd-input').value = '';
                showAdmin();
            } catch (error) {
                alert(error.message);
                document.getElementById('pwd-input').value = '';
                document.getElementById('pwd-input').focus();
            } finally {
                button.disabled = false;
            }
        }

        document.getElementById('login-btn').addEventListener('click', attemptLogin);
        document.getElementById('pwd-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') attemptLogin();
        });

        const itemRemovalTimers = new Map();

        const imageModal = document.getElementById('image-modal');
        const imageModalPreview = document.getElementById('image-modal-preview');
        const imageModalTitle = document.getElementById('image-modal-title');
        const imageModalClose = document.getElementById('image-modal-close');
        let lastImageTrigger = null;

        function openImageModal(trigger) {
            const imageSrc = trigger.dataset.imageSrc;
            const imageLabel = trigger.dataset.imageLabel;
            if (!imageSrc) return;

            lastImageTrigger = trigger;
            imageModalPreview.src = imageSrc;
            imageModalPreview.alt = `${imageLabel} 전체 이미지`;
            imageModalTitle.textContent = `${imageLabel} · 전체 이미지`;
            imageModal.classList.add('is-visible');
            imageModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('image-modal-open');
            imageModalClose.focus();
        }

        function closeImageModal() {
            imageModal.classList.remove('is-visible');
            imageModal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('image-modal-open');
            imageModalPreview.removeAttribute('src');
            if (lastImageTrigger?.isConnected) lastImageTrigger.focus();
        }

        document.getElementById('content').addEventListener('click', function(e) {
            const trigger = e.target.closest('.image-open-button');
            if (trigger && this.contains(trigger)) openImageModal(trigger);
        });

        imageModalClose.addEventListener('click', closeImageModal);
        imageModal.addEventListener('click', function(e) {
            if (e.target === imageModal) closeImageModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && imageModal.classList.contains('is-visible')) {
                closeImageModal();
            }
        });

        const STYLE_LABELS = Object.freeze({
            none: '변환하지 않음',
            distortion_lens_filter: '볼록거울',
            face_filter: '얼굴 필터',
            canny_filter: '윤곽선',
            anime: '애니메이션',
            watercolor: '수채화',
            comic: '코믹북'
        });
        const GENDER_LABELS = Object.freeze({
            male: '남성',
            female: '여성',
            mixed: '혼성 / 커플'
        });
        const FRAME_COLOR_LABELS = Object.freeze({
            clear_white: '클리어 화이트',
            matte_black: '매트 블랙',
            cybernetic_blue: '사이버네틱 블루',
            metal_purple: '메탈 퍼플',
            liquid_glass: '리퀴드 글라스',
            black_white: '블랙 & 화이트',
            cobalt_cream: '코발트 & 크림',
            burgundy_blush: '버건디 & 블러시',
            forest_sand: '포레스트 & 샌드',
            orange_navy: '오렌지 & 네이비'
        });
        const STATUS_CONFIG = Object.freeze({
            captured: { label: '촬영됨', placeholder: '아직 변환하지 않은 사진입니다.' },
            processing: { label: '변환 중', placeholder: '변환 결과를 생성하고 있습니다.' },
            success: { label: '변환 성공', placeholder: '변환 결과를 준비하고 있습니다.' },
            failed: { label: '변환 실패', placeholder: '변환에 실패하여 결과 사진이 없습니다.' }
        });

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function getMetadataLabel(labels, value, hasMetadata) {
            if (!hasMetadata || value === null || value === undefined || value === '') {
                return '기록 없음';
            }
            return labels[value] || '알 수 없음';
        }

        function getBooleanLabel(value, hasMetadata) {
            if (!hasMetadata || typeof value !== 'boolean') return '기록 없음';
            return value ? '사용' : '미사용';
        }

        function getFrameOutputLabel(metadata, hasMetadata) {
            if (!hasMetadata || typeof metadata.add_frame !== 'boolean') {
                return '기록 없음';
            }
            if (!metadata.add_frame) return '미사용';
            return metadata.result_only === true
                ? '사용/단일출력'
                : '사용/복수출력';
        }

        function createPhotoMetadataHTML(item) {
            const hasMetadata = Boolean(item.metadata && typeof item.metadata === 'object');
            const metadata = hasMetadata ? item.metadata : {};
            const frameColorLabel = !hasMetadata
                ? '기록 없음'
                : metadata.add_frame === false
                    ? '해당 없음'
                    : getMetadataLabel(FRAME_COLOR_LABELS, metadata.frame_color, true);

            return `
                <dl class="photo-metadata" aria-label="변환 설정">
                    <div class="photo-metadata-item">
                        <dt class="photo-metadata-label">스타일</dt>
                        <dd class="photo-metadata-value">${getMetadataLabel(STYLE_LABELS, metadata.style, hasMetadata)}</dd>
                    </div>
                    <div class="photo-metadata-item">
                        <dt class="photo-metadata-label">성별</dt>
                        <dd class="photo-metadata-value">${getMetadataLabel(GENDER_LABELS, metadata.gender, hasMetadata)}</dd>
                    </div>
                    <div class="photo-metadata-item">
                        <dt class="photo-metadata-label">프레임 여부</dt>
                        <dd class="photo-metadata-value">${getFrameOutputLabel(metadata, hasMetadata)}</dd>
                    </div>
                    <div class="photo-metadata-item">
                        <dt class="photo-metadata-label">프레임 색깔</dt>
                        <dd class="photo-metadata-value">${frameColorLabel}</dd>
                    </div>
                    <div class="photo-metadata-item">
                        <dt class="photo-metadata-label">ADetailer 보정</dt>
                        <dd class="photo-metadata-value">${getBooleanLabel(metadata.adetailer_enabled, hasMetadata)}</dd>
                    </div>
                </dl>
            `;
        }

        function createImageHTML(item, type) {
            const isRaw = type === 'raw';
            const url = isRaw ? item.raw_url : item.result_url;
            const label = isRaw ? 'RAW' : 'Result';
            const status = STATUS_CONFIG[item.status] || STATUS_CONFIG.captured;

            if (!url) {
                const placeholder = isRaw ? '원본 사진이 없습니다.' : status.placeholder;
                return `
                    <div class="img-box image-placeholder" aria-label="${escapeHTML(label)} 이미지 없음">
                        <div class="img-title">${escapeHTML(label)}</div>
                        <div class="image-placeholder-copy">${escapeHTML(placeholder)}</div>
                    </div>
                `;
            }

            const separator = String(url).includes('?') ? '&' : '?';
            const imageSrc = `${url}${separator}cache=${encodeURIComponent(item.timestamp)}`;
            return `
                <button class="img-box image-open-button" type="button" data-image-src="${escapeHTML(imageSrc)}" data-image-label="${escapeHTML(label)}">
                    <div class="img-title">${escapeHTML(label)}</div>
                    <img src="${escapeHTML(imageSrc)}" alt="${escapeHTML(label)}">
                </button>
            `;
        }

        function createItemHTML(item) {
            const itemId = item.id || item.folder;
            const statusKey = STATUS_CONFIG[item.status] ? item.status : 'captured';
            const status = STATUS_CONFIG[statusKey];
            return `
                <div class="item" id="item-${escapeHTML(itemId)}">
                    <div class="item-header">
                        <div class="item-info">
                            <div class="folder-name">${escapeHTML(item.folder)}</div>
                            <div class="time-stamp">${escapeHTML(item.time)}</div>
                        </div>
                        <div class="item-badge status-${escapeHTML(statusKey)}">${escapeHTML(status.label)}</div>
                    </div>

                    ${createPhotoMetadataHTML(item)}

                    <div class="row">
                        ${createImageHTML(item, 'raw')}
                        ${createImageHTML(item, 'result')}
                    </div>
                </div>
            `;
        }

        function getItemSignature(item) {
            return JSON.stringify([
                item.status,
                item.raw_url,
                item.result_url,
                item.timestamp,
                item.metadata
            ]);
        }

        function createItemElement(item, index, animate = true) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = createItemHTML(item);
            const element = wrapper.firstElementChild;
            element.dataset.itemSignature = getItemSignature(item);
            if (animate) element.style.animationDelay = `${index * 0.08}s`;
            return element;
        }

        function updateDOM(newItems) {
            const container = document.getElementById("content");

            if (newItems.length === 0) {
                itemRemovalTimers.forEach(timer => clearTimeout(timer));
                itemRemovalTimers.clear();
                container.querySelectorAll('.item').forEach(element => element.remove());

                if (!container.querySelector('.empty-state')) {
                    container.insertAdjacentHTML('beforeend', `
                        <div class="empty-state">
                            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <div class="empty-text">아직 처리된 이미지가 없습니다</div>
                        </div>
                    `);
                }
                return;
            }

            const emptyState = container.querySelector('.empty-state');
            if (emptyState && newItems.length > 0) {
                emptyState.remove();
            }

            const nextItemIds = new Set(newItems.map(item => `item-${item.id || item.folder}`));

            newItems.forEach((item, index) => {
                const itemId = item.id || item.folder;
                const id = `item-${itemId}`;
                let el = document.getElementById(id);
                const signature = getItemSignature(item);

                if (itemRemovalTimers.has(id)) {
                    clearTimeout(itemRemovalTimers.get(id));
                    itemRemovalTimers.delete(id);
                    if (el) el.style.animation = '';
                }

                if (!el) {
                    el = createItemElement(item, index);
                } else if (el.dataset.itemSignature !== signature) {
                    const updatedEl = createItemElement(item, index, false);
                    el.replaceWith(updatedEl);
                    el = updatedEl;
                }

                const elementAtIndex = container.children[index];
                if (elementAtIndex !== el) {
                    container.insertBefore(el, elementAtIndex || null);
                }
            });

            container.querySelectorAll('.item').forEach(el => {
                if (!nextItemIds.has(el.id) && !itemRemovalTimers.has(el.id)) {
                    el.style.animation = 'cardExit 0.25s ease forwards';
                    const removalTimer = setTimeout(() => {
                        el.remove();
                        itemRemovalTimers.delete(el.id);
                    }, 250);
                    itemRemovalTimers.set(el.id, removalTimer);
                }
            });

        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes cardExit {
                to {
                    opacity: 0;
                    transform: translateY(-12px) scale(0.98);
                }
            }
        `;
        document.head.appendChild(style);

        async function loadData() {
            if (adminDataRequestInFlight) return;
            adminDataRequestInFlight = true;
            const requestController = new AbortController();
            const requestTimeout = setTimeout(
                () => requestController.abort(),
                ADMIN_REFRESH_TIMEOUT_MS
            );

            try {
                const res = await fetch("/admin_data", {
                    signal: requestController.signal,
                    cache: 'no-store'
                });
                if (res.status === 401) {
                    setLiveUpdateStatus(false);
                    if (adminRefreshTimer) clearInterval(adminRefreshTimer);
                    adminRefreshTimer = null;
                    if (liveUpdateHealthTimer) clearInterval(liveUpdateHealthTimer);
                    liveUpdateHealthTimer = null;
                    document.getElementById('app-content').style.display = 'none';
                    document.getElementById('login-overlay').style.display = 'flex';
                    return;
                }
                if (!res.ok) throw new Error(`관리자 데이터 요청 실패: ${res.status}`);

                renderAdminData(await res.json());
                setLiveUpdateStatus(true);
            } catch (e) {
                setLiveUpdateStatus(false);
                console.error("데이터를 불러오는데 실패했습니다.", e);
            } finally {
                clearTimeout(requestTimeout);
                adminDataRequestInFlight = false;
            }
        }

        async function restoreAdminSession() {
            try {
                const res = await fetch('/admin_data', { cache: 'no-store' });
                if (!res.ok) return;
                showAdmin(await res.json());
            } catch (error) {
                console.error('관리자 세션 확인에 실패했습니다.', error);
            }
        }

        restoreAdminSession();
    </script>
</body>
</html>
