<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 다운로드</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #3b82f6;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, 0.15);
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.16);
            --text: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            background: #0c0c0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient lighting */
        .ambient {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            pointer-events: none;
            animation: drift 15s ease-in-out infinite;
        }

        .ambient-1 {
            background: rgba(16, 185, 129, 0.25);
            top: -250px;
            right: -150px;
        }

        .ambient-2 {
            background: rgba(99, 102, 241, 0.2);
            bottom: -250px;
            left: -150px;
            animation-delay: -7s;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeDown 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--success-soft);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--success);
            margin-bottom: 16px;
        }

        .status-badge svg {
            width: 16px;
            height: 16px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* Image Card */
        .image-card {
            position: relative;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 32px;
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
        }

        #preview {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            display: block;
        }

        /* Button Group */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        /* QR Modal */
        #qrModal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
        }

        #qrModalContent {
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 40px 36px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            width: 90%;
            max-width: 360px;
            animation: modalEnter 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(16px);
            }
        }

        #qrModalContent h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .qr-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .qr-wrapper {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            display: inline-block;
        }

        #qr_image {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 8px;
        }

        #closeModal {
            margin-top: 24px;
        }

        :root {
            --primary: #ff5c35;
            --primary-soft: rgba(255, 92, 53, 0.16);
            --success: #148567;
            --success-soft: rgba(20, 133, 103, 0.13);
            --surface: rgba(255, 252, 246, 0.93);
            --surface-hover: rgba(33, 29, 41, 0.06);
            --border: rgba(33, 29, 41, 0.11);
            --border-focus: rgba(33, 29, 41, 0.22);
            --text: #211d29;
            --text-muted: rgba(33, 29, 41, 0.58);
        }

        body {
            min-height: 100svh;
            justify-content: flex-start;
            padding: clamp(34px, 7vh, 72px) 20px 42px;
            background:
                radial-gradient(circle at 12% 14%, rgba(255, 197, 70, 0.28), transparent 25%),
                radial-gradient(circle at 88% 82%, rgba(89, 222, 192, 0.20), transparent 30%),
                #17131d;
            font-family: Inter, Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.24;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 42px 42px;
        }

        .ambient {
            opacity: 0.54;
        }

        .ambient-1 {
            background: rgba(255, 92, 53, 0.22);
        }

        .ambient-2 {
            background: rgba(89, 222, 192, 0.18);
        }

        .header {
            position: relative;
            z-index: 1;
            margin-bottom: 24px;
        }

        .status-badge {
            margin-bottom: 14px;
            padding: 8px 14px;
            border-color: rgba(94, 229, 196, 0.26);
            background: rgba(94, 229, 196, 0.12);
            color: #79e8cd;
            font-weight: 750;
            letter-spacing: -0.01em;
        }

        h2 {
            color: #fffaf3;
            font-size: clamp(26px, 5vw, 38px);
            font-weight: 850;
            letter-spacing: -0.045em;
        }

        .image-card {
            z-index: 1;
            margin-bottom: 28px;
            padding: 14px 14px 48px;
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 8px;
            background: #fffcf6;
            box-shadow:
                0 32px 72px rgba(4, 3, 8, 0.42),
                0 0 0 1px rgba(33, 29, 41, 0.08);
            transform: rotate(-0.6deg);
        }

        .image-card::after {
            content: "SNAPPOCKET  /  YOUR MOMENT, READY TO GO";
            position: absolute;
            right: 15px;
            bottom: 16px;
            left: 15px;
            color: rgba(33, 29, 41, 0.52);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-align: center;
        }

        #preview {
            width: min(76vw, 480px);
            max-width: none;
            aspect-ratio: 16 / 9;
            border-radius: 3px;
            background:
                linear-gradient(135deg, rgba(255, 107, 69, 0.18), rgba(89, 222, 192, 0.16)),
                #e9e3da;
            object-fit: cover;
        }

        .button-group {
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            width: min(100%, 520px);
            max-width: none;
            gap: 12px;
        }

        .button-group .btn-secondary {
            grid-column: 1 / -1;
        }

        .btn {
            min-height: 54px;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 800;
            letter-spacing: -0.015em;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.22);
        }

        .btn:active {
            transform: translateY(1px) scale(0.99);
        }

        .btn:focus-visible {
            outline: 3px solid rgba(255, 199, 61, 0.82);
            outline-offset: 3px;
        }

        .btn-primary {
            background: var(--primary);
        }

        .btn-primary:hover {
            background: #eb4724;
        }

        .btn-success {
            background: #148567;
        }

        .btn-success:hover {
            background: #0d7157;
        }

        .btn-secondary {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fffaf3;
            box-shadow: none;
        }

        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.30);
            background: rgba(255, 255, 255, 0.13);
        }

        #qrModal {
            background: rgba(13, 10, 17, 0.82);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        #qrModalContent {
            max-width: 390px;
            padding: 34px 28px 28px;
            border: 1px solid rgba(255, 255, 255, 0.80);
            border-radius: 28px;
            background: #fffcf6;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
        }

        #qrModalContent h3 {
            font-size: 22px;
            font-weight: 850;
            letter-spacing: -0.035em;
        }

        .qr-wrapper {
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 10px 28px rgba(33, 29, 41, 0.10);
        }

        #qr_image {
            border-radius: 10px;
        }

        #closeModal {
            color: var(--text);
            border-color: var(--border);
            background: #efe9e1;
        }

        #closeModal:hover {
            border-color: var(--border-focus);
            background: #e5ded5;
        }

        @media (max-width: 560px) {
            body {
                padding: 28px 16px 32px;
            }

            .header {
                margin-bottom: 20px;
            }

            #preview {
                width: min(82vw, 480px);
            }

            .image-card {
                padding: 10px 10px 42px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .button-group .btn-secondary {
                grid-column: auto;
            }

            #qrModalContent {
                padding: 28px 20px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<div class="header">
    <div class="status-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        완료
    </div>
    <h2>사진이 준비되었습니다</h2>
</div>

<div class="image-card">
    <img id="preview" src="/public/{{ folder }}/result.png" alt="Result Image">
</div>

<div class="button-group">
    <button class="btn btn-primary" onclick="openQRModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
        </svg>
        QR로 다운로드
    </button>

    <button class="btn btn-success" onclick="downloadImage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        사진 다운로드
    </button>

    <button class="btn btn-secondary" onclick="window.location.href='{{ lan_url }}'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        처음으로
    </button>
</div>

<!-- QR Modal -->
<div id="qrModal">
    <div id="qrModalContent">
        <h3>휴대폰으로 다운로드</h3>
        <p class="qr-subtitle">QR 코드를 스캔하세요</p>
        
        <div class="qr-wrapper">
            <img id="qr_image" src="" alt="QR Code">
        </div>

        <button class="btn btn-secondary" id="closeModal" onclick="closeQRModal()">닫기</button>
    </div>
</div>

<script>
function downloadImage() {
    const folder = "{{ folder }}";
    const link = document.createElement('a');
    link.href = `/download/${folder}/`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function openQRModal() {
    const modal = document.getElementById("qrModal");
    const qrImg = document.getElementById("qr_image");
    const folder = "{{ folder }}";

    modal.style.display = "flex";

    function tryLoad() {
        fetch(`/static/qr/${folder}.png`)
            .then(r => {
                if (r.ok) {
                    qrImg.src = `/static/qr/${folder}.png`;
                } else {
                    console.log("QR not ready, retrying...");
                    setTimeout(tryLoad, 300);
                }
            });
    }

    tryLoad();
}

function closeQRModal() {
    document.getElementById("qrModal").style.display = "none";
}
</script>

</body>
</html>
