<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 다운로드</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #3b82f6;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, 0.15);
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.16);
            --text: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            background: #0c0c0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient lighting */
        .ambient {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            pointer-events: none;
            animation: drift 15s ease-in-out infinite;
        }

        .ambient-1 {
            background: rgba(16, 185, 129, 0.25);
            top: -250px;
            right: -150px;
        }

        .ambient-2 {
            background: rgba(99, 102, 241, 0.2);
            bottom: -250px;
            left: -150px;
            animation-delay: -7s;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeDown 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--success-soft);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--success);
            margin-bottom: 16px;
        }

        .status-badge svg {
            width: 16px;
            height: 16px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* Image Card */
        .image-card {
            position: relative;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 32px;
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
        }

        #preview {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            display: block;
        }

        /* Button Group */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        /* QR Modal */
        #qrModal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
        }

        #qrModalContent {
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 40px 36px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            width: 90%;
            max-width: 360px;
            animation: modalEnter 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(16px);
            }
        }

        #qrModalContent h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .qr-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .qr-wrapper {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            display: inline-block;
        }

        #qr_image {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 8px;
        }

        #closeModal {
            margin-top: 24px;
        }
    </style>
</head>
<body>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<div class="header">
    <div class="status-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        완료
    </div>
    <h2>사진이 준비되었습니다</h2>
</div>

<div class="image-card">
    <img id="preview" src="/public/{{ folder }}/result.png" alt="Result Image">
</div>

<div class="button-group">
    <button class="btn btn-primary" onclick="openQRModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
        </svg>
        QR로 다운로드
    </button>

    <button class="btn btn-success" onclick="downloadImage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        사진 다운로드
    </button>

    <button class="btn btn-secondary" onclick="window.location.href='{{ lan_url }}'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        처음으로
    </button>
</div>

<!-- QR Modal -->
<div id="qrModal">
    <div id="qrModalContent">
        <h3>휴대폰으로 다운로드</h3>
        <p class="qr-subtitle">QR 코드를 스캔하세요</p>
        
        <div class="qr-wrapper">
            <img id="qr_image" src="" alt="QR Code">
        </div>

        <button class="btn btn-secondary" id="closeModal" onclick="closeQRModal()">닫기</button>
    </div>
</div>

<script>
function downloadImage() {
    const folder = "{{ folder }}";
    const link = document.createElement('a');
    link.href = `/public/${folder}/result.png`;
    link.download = `photo_${folder}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function openQRModal() {
    const modal = document.getElementById("qrModal");
    const qrImg = document.getElementById("qr_image");
    const folder = "{{ folder }}";

    modal.style.display = "flex";

    function tryLoad() {
        fetch(`/static/qr/${folder}.png`)
            .then(r => {
                if (r.ok) {
                    qrImg.src = `/static/qr/${folder}.png`;
                } else {
                    console.log("QR not ready, retrying...");
                    setTimeout(tryLoad, 300);
                }
            });
    }

    tryLoad();
}

function closeQRModal() {
    document.getElementById("qrModal").style.display = "none";
}
</script>

</body>
</html>
